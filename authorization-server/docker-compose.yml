version: '3.8'

services:
  auth-staging:
    container_name: authorization-server-staging
    build:
      context: .
      dockerfile: Dockerfile.staging
    ports:
      - "8084:8084"
    env_file:
      - ./.env
  auth-production:
    container_name: authorization-server-production
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "8087:8084"
    env_file:
      - ./.env
  auth-development:
    container_name: authorization-server-development
    build:
      context: .
      dockerfile: Dockerfile.development
    ports:
      - "8083:8084"
    env_file:
      - ./.env
