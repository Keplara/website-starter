<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Password Reset</title>
  <style>
    .button {
      display: inline-block;
      padding: 12px 24px;
      font-size: 16px;
      color: #ffffff;
      background-color: #0072ce;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 10px;
    }
    .button:hover {
      background-color: #005bb5;
    }
    body {
      font-family: Arial, sans-serif;
      line-height: 1.5;
      color: #333333;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <div class="container">
    <p>Hello,</p>

    <p>Someone recently requested a password reset for the account with the email address <strong>{{email}}</strong>.</p>

    <p>Please use the button below to reset the password for your account with the username <strong>{{username}}</strong>:</p>

    <p>
      <a href="{{baseUrl}}/reset_password?key={{resetKey}}" class="button">Reset Password</a>
    </p>

    <p>Note: If you did not request a password reset, you can safely ignore this email.</p>
  </div>
</body>
</html>
