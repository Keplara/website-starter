redis:
  username: ${REDIS_USERNAME}
  password: ${REDIS_PASSWORD}
  port: ${REDIS_PORT}
server:
  port: ${PORT}
logging:
  level:
    org:
      springframework:
        security:
          TRACE
spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}?authSource=admin&authMechanism=SCRAM-SHA-256&tls=true
    ssl:
      enabled: true
  session:
    redis:
      repository-type: default
      expiration: 60
      host: ${REDIS_HOST}
    timeout: 5m
    tracker:
      timeout: 30d
local:
  companyName: ${COMPANY_NAME}
  userAuthClientSecret: ${USER_AUTH_CLIENT_SECRET}
  authClientBaseUrl: ${AUTH_CLIENT_BASE_URL}
  userClientBaseUrl: ${USER_CLIENT_BASE_URL}
  adminAuthClientSecret: ${ADMIN_AUTH_CLIENT_SECRET}
  iamAuthClientSecret: ${IAM_AUTH_CLIENT_SECRET}
  adminClientBaseUrl: ${ADMIN_CLIENT_BASE_URL}
  jwt:
    secretKey: ${JWT_KEY}
    payloadKey: ${JWT_PAYLOAD_KEY} 
  client:
    registration:
      secret: ${CLIENT_REGISTRATION_SECRET}
  email:
    mode: smtp  # "ses" or "smtp"
    smtp:
      host:  ${EMAIL_HOST}
      port: ${EMAIL_PORT}
  aws:
    accessKey: ${AWS_S3_ACCESS_KEY}
    secretKey: ${AWS_S3_SECRET_KEY}
    ses:
      region: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}
      endpoint: ${AWS_S3_ENDPOINT}  # e.g., http://localhost:9000 for MinIO
      region: ${AWS_REGION}