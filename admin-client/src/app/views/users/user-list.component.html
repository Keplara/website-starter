<div style="display:flex; justify-content: flex-end; align-items: center; margin: 16px 0; padding-right: 20px; gap: 8px;">
  <button mat-raised-button color="primary" (click)="addUser()">
    <mat-icon>add</mat-icon>
    Add User
  </button>
</div>

<mat-selection-list style="padding: 15px;">
  <ng-container *ngFor="let user of users; let last = last">
    <mat-list-option [disableRipple]="true" style="padding: 0;">
      <div class="user-list-item" style="display: flex; align-items: center; width: 100%; padding: 20px 0;">
        <img matListItemAvatar [src]="user.avatar || 'https://material.angular.dev/assets/img/examples/shiba1.jpg'" style="width: 48px; height: 48px; border-radius: 50%; margin-right: 16px; object-fit: cover;" />
        <div style="flex: 1 1 auto;">
          <div style="font-weight: 600; font-size: 1.1em;">{{ user.username }} — {{ user.firstname }} {{ user.lastname }} (Age: {{ user.age }})</div>
          <div style="font-size: 0.95em; color: #666; margin-top: 2px;">
            Created: {{ user.createdOn }} by {{ user.createdBy }} | Modified: {{ user.modifiedOn }} by {{ user.modifiedBy }}
          </div>
        </div>
        <div style="display: flex; gap: 8px; margin-left: 16px;">
          <a [routerLink]="[user.username, 'edit']">
            <button mat-button color="primary">Edit</button>
          </a>
          <button mat-button color="warn" (click)="confirmDelete(user)">Delete</button>
        </div>
      </div>
    </mat-list-option>
    <mat-divider *ngIf="!last" style="height: 3px; background: #bdbdbd; opacity: 1;"></mat-divider>
  </ng-container>
</mat-selection-list>
<style>
.user-list-item:hover {
  background: #f5f5f5;
  transition: background 0.2s;
}
</style>
