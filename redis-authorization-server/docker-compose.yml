version: "3.9"

services:
  redis-authorization-server-development:
    build:
      context: .
      dockerfile: Dockerfile.development
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    container_name: redis-authorization-server-development
    ports:
      - "6379:6379"
    volumes:
      - redis-authorization-server-development-data:/data
  redis-authorization-server-staging:
    build:
      context: .
      dockerfile: Dockerfile.staging
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    container_name: redis-authorization-server-staging
    ports:
      - "6381:6379"
    volumes:
      - redis-authorization-server-staging-data:/data
  redis-authorization-server-production:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    container_name: redis-authorization-server-production
    ports:
      - "6380:6379"
    volumes:
      - redis-authorization-server-production-data:/data

volumes:
  redis-authorization-server-development-data:
  redis-authorization-server-production-data:
  redis-authorization-server-staging-data:
