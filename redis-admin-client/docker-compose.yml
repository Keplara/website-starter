version: "3.9"

services:
  redis-admin-client-development:
    build:
      context: .
      dockerfile: Dockerfile.development
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    container_name: redis-admin-client-development
    ports:
      - "6366:6379"
    volumes:
      - redis-admin-client-development-data:/data
  redis-admin-client-staging:
    build:
      context: .
      dockerfile: Dockerfile.staging
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    container_name: redis-admin-client-staging
    ports:
      - "6367:6379"
    volumes:
      - redis-admin-client-staging-data:/data
  redis-admin-client-production:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    container_name: redis-admin-client-production
    ports:
      - "6368:6379"
    volumes:
      - redis-admin-client-production-data:/data

volumes:
  redis-admin-client-development-data:
  redis-admin-client-production-data:
  redis-admin-client-staging-data:
